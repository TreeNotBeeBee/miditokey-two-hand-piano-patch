name: Build two-hand piano patcher

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build patch payload
        run: dotnet build src/PatchPayload/PatchPayload.csproj -c Release --nologo

      - name: Build patcher
        run: dotnet build src/Patcher/Patcher.csproj -c Release --nologo

      - name: Build behavior checks
        run: dotnet build tests/BehaviorChecks/BehaviorChecks.csproj -c Release --nologo
